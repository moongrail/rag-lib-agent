spring:
  application:
    name: rag-assistant
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:rest,webui}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rag}
    username: ${SPRING_DATASOURCE_USERNAME:rag}
    password: ${SPRING_DATASOURCE_PASSWORD:rag}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  thymeleaf:
    cache: false
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 1GB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,retrieval,ingestion
  endpoint:
    health:
      show-details: when-authorized
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:}
  tracing:
    sampling:
      probability: 1.0

app:
  tenant:
    header-name: X-Tenant-Id
    default: default
  embedding:
    provider: ${EMBEDDING_PROVIDER:local}
    ollama:
      base-url: http://localhost:11434
      model-name: nomic-embed-text
    huggingface:
      base-url: http://localhost:8082
      model-name: BAAI/bge-m3
    openai:
      base-url: https://api.openai.com/v1
      api-key: ${EMBEDDING_API_KEY:}
      model-name: text-embedding-3-small
    lmstudio:
      base-url: http://127.0.0.1:1234/v1
      api-key: lm-studio
      model-name: omnicoder-qwen3.5-9b-claude-4.6-opus-uncensored-v2
  chat:
    provider: ${CHAT_PROVIDER:openrouter}
    openrouter:
      base-url: https://openrouter.ai/api/v1
      api-key: ${OPENROUTER_API_KEY:}
      model-name: cohere/north-mini-code:free
      temperature: 0.2
      max-tokens: 2048
    lmstudio:
      base-url: http://127.0.0.1:1234/v1
      api-key: lm-studio
      model-name: omnicoder-qwen3.5-9b-claude-4.6-opus-uncensored-v2
      temperature: 0.2
      max-tokens: 2048
  retrieval:
    max-results: 5
    min-score: 0.0
    rrf-k: 60
  ingestion:
    chunk-size: 1000
    chunk-overlap: 200
  security:
    enabled: false
    jwt-secret: ${JWT_SECRET:change-me}
  telegram:
    enabled: false
    token: ${TELEGRAM_BOT_TOKEN:}
    allowed-chat-ids: ${TELEGRAM_ALLOWED_CHAT_IDS:}
